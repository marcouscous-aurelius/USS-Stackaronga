name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project FocusStackPro.xcodeproj \
            -scheme FocusStackPro \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=18.5' \
            CODE_SIGNING_ALLOWED=NO
